<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="style.css">

<title>Deniz Portfolio</title>

</head>
<body>

<nav class="navbar">

    <ul class="nav-links">
        <li><a href="#about">About</a></li>
        <li><a href="#projects">Projects</a></li>
        <li><a href="#contact">Contact</a></li>
    </ul>

</nav>

<!-- HERO (TOP SECTION) -->
<section class="hero">

    <h1>Hello, I'm <span>Deniz</span></h1>

    <p>
        Beginner Developer learning PHP, JavaScript,
        HTML and CSS while building modern websites.
    </p>

    <button id="heroBtn">View Projects </button>
    <br>
    <button id="themeBtn">Toggle Theme </button>
    
</section>


<section id="about" class="section">
    <h2>About</h2>
</section>

<section id="projects" class="section">
    <h2>Projects</h2>

    <div class="projects-grid">

        <div class="project-card" id="openNotes">

            <h3>Notes App</h3>

            <p>
                Simple notes application using JavaScript
                and localStorage.
            </p>

        </div>

    </div>

</section>

<div class="modal" id="notesModal">

    <div class="modal-content">

        <span class="close-btn" id="closeNotes">&times;</span>

        <h2>Notes App</h2>

        <input type="text" id="noteInput" placeholder="Write note...">

        <button id="addNoteBtn">Add</button>

        <div id="notesContainer"></div>

    </div>

</div>


<section id="contact" class="section">
    <h2>Contact</h2>
</section>


<script src="script.js"></script>

</body>
</html>
